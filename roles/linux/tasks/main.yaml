---
# TODO: linux confi
# TODO: install packages

# Usuario alvo: ansible_user, ou o usuario que abriu a conexao (SUDO_USER) quando nao definido
- name: Definir usuario alvo
  ansible.builtin.set_fact:
    target_user: "{{ ansible_user | default(ansible_env.SUDO_USER | default(ansible_user_id)) }}"

- name: Consultar home do usuario alvo
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"

- name: Definir home do usuario alvo
  ansible.builtin.set_fact:
    target_home: "{{ getent_passwd[target_user][4] }}"

# Os binarios baixados (Neovim, lazygit, fzf) sao amd64
- name: Validar arquitetura amd64
  ansible.builtin.assert:
    that: ansible_architecture in ['x86_64', 'amd64']
    fail_msg: "Arquitetura {{ ansible_architecture }} nao suportada; apenas amd64"

# Diretorio temporario com nome imprevisivel (em vez de caminhos fixos em /tmp)
- name: Criar diretorio temporario
  ansible.builtin.tempfile:
    state: directory
    suffix: basic_install
  register: linux_tmp
  changed_when: false

- name: Permitir leitura do diretorio temporario (script do Oh My Zsh roda como outros usuarios)
  ansible.builtin.file:
    path: "{{ linux_tmp.path }}"
    state: directory
    mode: "0755"

# Installar o node para poder instalar as linter do Mason
- name: Baixar script do repositorio NodeSource para Node.js 22.x
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: "{{ linux_tmp.path }}/nodesource_setup.sh"
    mode: "0755"

- name: Adicionar repositório NodeSource para Node.js 22.x
  ansible.builtin.command: bash {{ linux_tmp.path }}/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.sources

# Update repostorio
- name: Update apt
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600

# Remover versão antiga nvim
- name: Remover a versão antiga nvim
  ansible.builtin.package:
    name: neovim
    state: absent

# Instala os pacotes necessarios
- name: Install packages
  ansible.builtin.package:
    name:
      - wget
      - fontconfig
      - git
      - stow
      - tar
      - tmux
      - fd-find
      - ripgrep
      - zsh
      - bat
      - wl-clipboard
      - zoxide
      - unzip
      - software-properties-common
      - build-essential
      - golang-go
      - nodejs
      - locales
      - make
      - python3
      - python3-pip
      - python3-apt
      - lua5.1
      - liblua5.1-0-dev
      - luarocks
    state: present

# eza nao existe nos repositorios do Ubuntu < 24.04 / Debian < 13; nao derruba o resto
- name: Install eza (quando disponivel)
  ansible.builtin.apt:
    name: eza
    state: present
  register: eza_install
  failed_when: false

- name: Avisar quando eza nao estiver disponivel
  ansible.builtin.debug:
    msg: "eza indisponivel nos repositorios desta distribuicao; instale manualmente"
  when: eza_install is failed

- name: Definir serie alvo do Neovim
  ansible.builtin.set_fact:
    neovim_version_series: "0.12"
    neovim_fallback_version: v0.12.0

- name: Verificar versao instalada do Neovim
  ansible.builtin.command: nvim --version
  register: neovim_current_version
  changed_when: false
  failed_when: false

- name: Consultar releases do Neovim
  ansible.builtin.uri:
    url: https://api.github.com/repos/neovim/neovim/releases
    headers: "{{ {'Authorization': 'Bearer ' ~ github_token} if github_token is defined else {} }}"
    return_content: true
  register: neovim_releases
  changed_when: false
  failed_when: false

- name: Definir release alvo do Neovim
  ansible.builtin.set_fact:
    neovim_release_tag: >-
      {{
        (
          neovim_releases.json | default([])
          | selectattr('tag_name', 'match', '^v' ~ neovim_version_series ~ '\\.\\d+$')
          | map(attribute='tag_name')
          | list
          | first
        ) | default(neovim_fallback_version, true)
      }}
    neovim_release_version: >-
      {{
        (
          (
            neovim_releases.json | default([])
            | selectattr('tag_name', 'match', '^v' ~ neovim_version_series ~ '\\.\\d+$')
            | map(attribute='tag_name')
            | list
            | first
          ) | default(neovim_fallback_version, true)
        ) | regex_replace('^v', '')
      }}
    neovim_installed_version: >-
      {{
        (
          neovim_current_version.stdout | default('')
          | regex_findall('NVIM v([0-9]+\.[0-9]+\.[0-9]+)')
          | first
        ) | default('')
      }}

- name: Verificar instalacao oficial atual do Neovim
  ansible.builtin.stat:
    path: /opt/nvim-linux-x86_64/bin/nvim
  register: neovim_official_binary

- name: Baixar tarball oficial do Neovim
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/download/{{ neovim_release_tag }}/nvim-linux-x86_64.tar.gz
    dest: "{{ linux_tmp.path }}/nvim-linux-x86_64.tar.gz"
    mode: "0644"
  when: neovim_installed_version != neovim_release_version or not neovim_official_binary.stat.exists

- name: Remover instalacao anterior do Neovim oficial
  ansible.builtin.file:
    path: /opt/nvim-linux-x86_64
    state: absent
  when: neovim_installed_version != neovim_release_version or not neovim_official_binary.stat.exists

- name: Instalar Neovim oficial
  ansible.builtin.unarchive:
    src: "{{ linux_tmp.path }}/nvim-linux-x86_64.tar.gz"
    dest: /opt
    remote_src: true
  when: neovim_installed_version != neovim_release_version or not neovim_official_binary.stat.exists

- name: Garantir link do binario do Neovim
  ansible.builtin.file:
    src: /opt/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
    force: true

- name: Remover tarball temporario do Neovim
  ansible.builtin.file:
    path: "{{ linux_tmp.path }}/nvim-linux-x86_64.tar.gz"
    state: absent
  when: neovim_installed_version != neovim_release_version or not neovim_official_binary.stat.exists

- name: Validar versao final do Neovim
  ansible.builtin.command: nvim --version
  register: neovim_final_version
  changed_when: false
  failed_when: >-
    (neovim_final_version.stdout | default('')) is not match('^NVIM v' ~ neovim_version_series ~ '\\.')


- name: Check if Ubuntu Desktop is installed
  ansible.builtin.shell: |
    dpkg-query -W -f='${Status}' ubuntu-desktop 2>/dev/null || \
    dpkg-query -W -f='${Status}' ubuntu-session 2>/dev/null || \
    dpkg-query -W -f='${Status}' gnome-shell 2>/dev/null
  register: ubuntu_desktop_status
  changed_when: false
  failed_when: false

- name: Debug Ubuntu Desktop detection
  ansible.builtin.debug:
    msg: "Ubuntu Desktop status: {{ ubuntu_desktop_status.stdout }}"

- name: Install npm if running on Ubuntu Desktop
  ansible.builtin.package:
    name: npm
    state: present
  when: "'install ok installed' in ubuntu_desktop_status.stdout"

- name: Garantir que o python3-venv está instalado
  ansible.builtin.package:
    name: python3-venv
    state: present

- name: Criar ambiente virtual para Python
  ansible.builtin.command: python3 -m venv {{ venv_path }}
  args:
    creates: "{{ venv_path }}"

- name: Atualizar pip, setuptools e wheel no venv
  ansible.builtin.pip:
    name:
      - pip
      - setuptools
      - wheel
    state: present
    virtualenv: "{{ venv_path }}"

- name: Instalar o isort no ambiente virtual
  ansible.builtin.pip:
    name: isort
    state: present
    virtualenv: "{{ venv_path }}"

- name: Garantir que o pipx está instalado
  ansible.builtin.pip:
    name: pipx
    state: present
    extra_args: --break-system-packages

- name: Instalar o ansible-lint via pipx
  ansible.builtin.shell: |
    export PATH="$HOME/.local/bin:$PATH"
    pipx install ansible-lint --pipx-args='--python python3'
    pipx ensurepath
  args:
    executable: /bin/bash
  register: pipx_ansible_lint
  changed_when: "'installed package' in pipx_ansible_lint.stdout"
  become: false

# Configurar o locale para en_us (fzf dependencies)
- name: Configurar locale para en_US.UTF-8
  ansible.builtin.command: locale-gen en_US.UTF-8
  args:
    creates: /usr/lib/locale/en_US.utf8

# Definir locale como padrao (fzf dependencies)
- name: Definir locale padrão no sistema
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    line: "{{ item }}"
    create: true
    mode: "0644"
  register: locale_lines
  loop:
    - "LANG=en_US.UTF-8"
    - "LANGUAGE=en_US.UTF-8"
    - "LC_ALL=en_US.UTF-8"

# Aplicar configurações do locale (fzf dependencies)
- name: Aplicar configurações de locale  # noqa: no-handler
  ansible.builtin.command: update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
  changed_when: true
  when: locale_lines is changed

- name: Verificar lazygit instalado
  ansible.builtin.stat:
    path: /usr/local/bin/lazygit
  register: lazygit_binary

# Install lazygit (uma vez; o binario existente e mantido)
- name: Consultar release do lazygit
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
    headers: "{{ {'Authorization': 'Bearer ' ~ github_token} if github_token is defined else {} }}"
    return_content: true
  register: lazygit_release
  changed_when: false
  failed_when: false
  when: not lazygit_binary.stat.exists

- name: Definir versao do lazygit
  ansible.builtin.set_fact:
    lazygit_version: "{{ (lazygit_release.json | default({})).tag_name | default(lazygit_fallback_version) | regex_replace('^v', '') }}"
  vars:
    lazygit_fallback_version: v0.44.1
  when: not lazygit_binary.stat.exists

- name: Install lazygit
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    include:
      - lazygit
    remote_src: true
    creates: /usr/local/bin/lazygit
  when: not lazygit_binary.stat.exists

# TODO: clone dotfiles repository

# Clonar repositorio dotfiles
- name: Clonar repositório dotfiles
  ansible.builtin.git:
    repo: https://github.com/saadmarcelo/dotfiles.git
    version: main
    dest: "{{ target_home }}/dotfiles/"
    update: true
  become: false

# Garantir que o zsh esta no /etc/shells
- name: Garantir que o zsh esta no /etc/shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /bin/zsh
    state: present

# TODO: oh my zsh config

# Download oh my zsh script
- name: Download Oh My Zsh installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: "{{ linux_tmp.path }}/install_ohmyzsh.sh"
    mode: "0644"

# Define lista de usuarios a serem instalados
- name: Define list of users
  ansible.builtin.set_fact:
    users: >-
      {{
        [
          { 'name': target_user, 'home': target_home },
          { 'name': 'root', 'home': '/root' }
        ] | unique
      }}

# Check se oh my zsh ja esta instalado
- name: Check if Oh My Zsh is already installed
  ansible.builtin.stat:
    path: "{{ item.home }}/.oh-my-zsh"
  register: ohmyzsh_status
  loop: "{{ users }}"

# Install Oh My Zsh for each user
- name: Install Oh My Zsh for users
  ansible.builtin.shell: |
    export HOME={{ item.home }}
    export USER={{ item.name }}
    sh {{ linux_tmp.path }}/install_ohmyzsh.sh --unattended
  args:
    executable: /bin/bash
  loop: "{{ users }}"
  become: true
  become_user: "{{ item.name }}"
  changed_when: true
  environment:
    ZSH: "{{ item.home }}/.oh-my-zsh"
  when: not (ohmyzsh_status.results | selectattr('item.name', 'equalto', item.name) | first).stat.exists

# Clone zsh-autosuggestions plugin
- name: Clone zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    version: master
    dest: "{{ item.home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    depth: 1
  loop: "{{ users }}"
  become: true
  become_user: "{{ item.name }}"

# Clone zsh-completions plugin
- name: Clone zsh-completions plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-completions
    version: master
    dest: "{{ item.home }}/.oh-my-zsh/custom/plugins/zsh-completions"
    depth: 1
  loop: "{{ users }}"
  become: true
  become_user: "{{ item.name }}"

# Clone zsh-syntax-highlighting plugin
- name: Clone zsh-syntax-highlighting plugin
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: master
    dest: "{{ item.home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    depth: 1
  loop: "{{ users }}"
  become: true
  become_user: "{{ item.name }}"

# Set zsh as default shell for each user (idempotente, depois de /etc/shells)
- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/zsh
  loop: "{{ users }}"

# Criar um link simbolico para o bat
- name: Criar link simbolico para o bat
  ansible.builtin.file:
    src: /usr/bin/batcat
    dest: /usr/bin/bat
    state: link

# Debian instala o binario do fd-find como fdfind
- name: Criar link simbolico para o fd
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link

# TODO: install font

# Fonte ja instalada?
- name: Verificar SauceCodePro Nerd Font
  ansible.builtin.command: fc-list
  register: font_check
  changed_when: false

- name: Garantir diretorio de fontes
  ansible.builtin.file:
    path: /usr/local/share/fonts
    state: directory
    mode: "0755"

# Download saucedcodepro font
- name: Baixar SauceCodePro Nerd Font
  ansible.builtin.get_url:
    url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/SourceCodePro.zip
    dest: "{{ linux_tmp.path }}/SourceCodePro.zip"
    mode: "0644"
  when: "'saucecodepro' not in (font_check.stdout | lower)"

# Unzip font file
- name: Descompactar o arquivo da fonte
  ansible.builtin.unarchive:
    src: "{{ linux_tmp.path }}/SourceCodePro.zip"
    dest: /usr/local/share/fonts
    remote_src: true
  when: "'saucecodepro' not in (font_check.stdout | lower)"

# update font cache
- name: Atualizar cache de fontes
  ansible.builtin.command: fc-cache -fv
  changed_when: true
  when: "'saucecodepro' not in (font_check.stdout | lower)"

# Remove ZIP file
- name: Remover o arquivo ZIP
  ansible.builtin.file:
    path: "{{ linux_tmp.path }}/SourceCodePro.zip"
    state: absent

# TODO: tmux config

# Create .tmux folder
- name: Create .tmux folder
  ansible.builtin.file:
    path: "{{ target_home }}/.tmux/"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    state: directory
    mode: "0755"

# Download TPM plugin
- name: Download TPM plugin
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm.git
    version: master
    dest: "{{ target_home }}/.tmux/plugins/tpm"
    update: true
  become: false

# Garantir permissao de execucao do scritp de instalcao dos plugins do tmux
- name: Garantir permissão de execução para o script install_plugins
  ansible.builtin.file:
    path: "{{ target_home }}/.tmux/plugins/tpm/bin/install_plugins"
    mode: "0755"
    state: file
  become: false

# Instalar o fzf (versao fixa; reinstala apenas se a versao mudar)
- name: Verificar versao do fzf
  ansible.builtin.command: fzf --version
  register: fzf_current_version
  changed_when: false
  failed_when: false

- name: Instalar o fzf
  ansible.builtin.unarchive:
    src: "https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_amd64.tar.gz"
    dest: /usr/bin/
    remote_src: true
  vars:
    fzf_version: "0.57.0"
  when: (fzf_current_version.stdout | default('')) is not match('^' ~ fzf_version ~ ' ')

# TODO: stow config

- name: Remover ou renomear .zshrc existente
  ansible.builtin.shell: |
    if [ -f {{ item.user }}/.zshrc ] && [ ! -L {{ item.user }}/.zshrc ]; then
      mv {{ item.user }}/.zshrc {{ item.user }}/.zshrc.bak
      echo moved
    fi
  register: zshrc_backup
  changed_when: "'moved' in zshrc_backup.stdout"
  become: true
  become_user: "{{ 'root' if item.user == '/root' else target_user }}"
  loop:
    - { user: "{{ target_home }}" }
    - { user: "/root" }

# Criar os links simbolicos com o stow
- name: Criar os links simbólicos com o stow para ansible_user e root
  ansible.builtin.shell: stow -v -d {{ target_home }}/dotfiles -t {{ item.user }}/ {{ item.config }}
  register: stow_result
  changed_when: "'LINK:' in stow_result.stderr"
  become: true
  become_user: "{{ 'root' if item.user == '/root' else target_user }}"
  args:
    executable: /bin/bash
  loop:
    - { user: "{{ target_home }}", config: "tmux" }
    - { user: "{{ target_home }}", config: "nvim" }
    - { user: "{{ target_home }}", config: "zshrc" }
    - { user: "/root", config: "tmux" }
    - { user: "/root", config: "nvim" }
    - { user: "/root", config: "zshrc" }

# Instalar plugins do Tmux (depois do stow: precisa do tmux.conf com a lista de plugins)
- name: Instalar plugins do Tmux
  ansible.builtin.shell: "{{ target_home }}/.tmux/plugins/tpm/bin/install_plugins"
  args:
    executable: /bin/bash
  register: tmux_plugins
  changed_when: "'Installing' in tmux_plugins.stdout"
  environment:
    TMUX_PLUGIN_MANAGER_PATH: "{{ target_home }}/.tmux/plugins"
    HOME: "{{ target_home }}"
    USER: "{{ target_user }}"
  become: false

- name: Remover diretorio temporario
  ansible.builtin.file:
    path: "{{ linux_tmp.path }}"
    state: absent
  changed_when: false
